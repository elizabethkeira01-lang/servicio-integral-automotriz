<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIA Control</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="portal.css">
</head>

<body>

<div class="portal-container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <img src="img/logo.png" class="logo-sidebar">

        <h2>SIA Control</h2>

        <p>Servicio Integral Automotriz</p>

        <nav>

            <button onclick="mostrarTab('dashboard')">🏠 Dashboard</button>

            <button onclick="mostrarTab('citas')">📅 Citas</button>

            <button onclick="mostrarTab('clientes')">👥 Clientes</button>

            <button onclick="mostrarTab('vehiculos')">🚗 Vehículos</button>

        </nav>

    </aside>

    <!-- CONTENIDO -->

    <main class="contenido">

        <div id="loginBox" class="card">

            <h1>Bienvenido Cristian 👋</h1>

            <p>Ingresa tu contraseña.</p>

            <input id="password" type="password" placeholder="Contraseña">

            <button onclick="login()">Entrar</button>

            <p id="loginMsg" class="mensaje"></p>

        </div>

        <div id="portal" style="display:none;">

            <!-- DASHBOARD -->

            <div id="tab-dashboard">

                <h1>Dashboard</h1>

                <div class="cards-dashboard">

                    <div class="card-info">
                        <h2>🚗</h2>
                        <h3>Vehículos</h3>
                        <span id="vehiculosDashboard">0</span>
                    </div>

                    <div class="card-info">
                        <h2>📅</h2>
                        <h3>Citas</h3>
                        <span id="citasDashboard">0</span>
                    </div>

                    <div class="card-info">
                        <h2>👥</h2>
                        <h3>Clientes</h3>
                        <span id="clientesDashboard">0</span>
                    </div>

                </div>

            </div>

            <!-- CITAS -->

            <div id="tab-citas" style="display:none;">

                <div id="resumenPortal" class="resumen-portal"></div>

                <div class="toolbar">

                    <input
                        id="buscar"
                        placeholder="Buscar cliente, placas o folio..."
                        oninput="cargarCitas()">

                    <button onclick="cargarCitas()">Actualizar</button>

                </div>

                <div id="listaCitas"></div>

            </div>

            <!-- CLIENTES -->

            <div id="tab-clientes" style="display:none;">

                <button onclick="cargarClientes()">

                    Actualizar clientes

                </button>

                <div id="listaClientes"></div>

            </div>

            <!-- VEHÍCULOS -->

            <div id="tab-vehiculos" style="display:none;">

                <button onclick="cargarVehiculos()">

                    Actualizar vehículos

                </button>

                <div id="listaVehiculos"></div>

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="portal.js"></script>

</body>

</html>
